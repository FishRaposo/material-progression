name: Bootstrap distribution JAR

on:
  push:
    branches:
      - agent/common-tags-jar-bootstrap

jobs:
  build-jar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Rebuild tracked distribution JAR
        run: ./gradlew syncDistributionJar --stacktrace
      - name: Upload rebuilt JAR
        uses: actions/upload-artifact@v4
        with:
          name: material-progression-bootstrap
          if-no-files-found: error
          path: dist/*.jar
