name: Bootstrap installable JAR

on:
  push:
    branches:
      - agent/installable-jar-bootstrap

jobs:
  build-jar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build production mod JAR
        run: ./gradlew jar --stacktrace

      - name: Upload production mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-material-progression-0.1.0
          if-no-files-found: error
          path: build/libs/material_progression-0.1.0.jar
