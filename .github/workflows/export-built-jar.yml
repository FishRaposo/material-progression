name: Export built JAR

on:
  push:
    branches:
      - agent/document-settled-design

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build synchronized distribution JAR
        run: ./gradlew syncDistributionJar --stacktrace

      - name: Upload synchronized JAR
        uses: actions/upload-artifact@v4
        with:
          name: material-progression-synchronized
          path: dist/material-progression-0.1.0.jar
