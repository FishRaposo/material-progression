name: Export built JAR

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable JAR
        run: ./gradlew syncDistributionJar --stacktrace

      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: material-progression-synchronized
          if-no-files-found: error
          path: dist/*.jar
