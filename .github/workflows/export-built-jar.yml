name: Export built JAR

on:
  push:
    branches:
      - agent/document-settled-design

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build synchronized distribution JAR
        run: ./gradlew syncDistributionJar --stacktrace

      - name: Commit synchronized JAR and remove exporter
        run: |
          rm .github/workflows/export-built-jar.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist/material-progression-0.1.0.jar .github/workflows/export-built-jar.yml
          git commit -m "build: synchronize primitive distribution jar"
          git push origin HEAD:agent/document-settled-design
